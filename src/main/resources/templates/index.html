<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alphanumeric CNPJ Generator</title>
</head>
<body>
    <h1>Hello, Thymleaf!!</h1>
    <form th:action="@{/generate}" method="get">
        <button type="submit">Generate CNPJ</button>
    </form>

    <h2 th:if="${cnpj != null}">
        Generated:
        <span th:text="${cnpj}"></span>
    </h2>
</body>
</html>
